name: Deploy

# Deploys main to the mailcellar Worker (mailcellar.icaruslab.dev) on OpenShip's runner.
# Needs secret CLOUDFLARE_API_TOKEN (Workers Scripts, Workers Routes, R2 edit on the
# account); without it the job builds and skips the upload.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, openship, linux, arm64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-bun
      - run: bun run build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping deploy"
            exit 0
          fi
          bunx wrangler deploy --var "APP_VERSION:$(git describe --tags --always)"
