name: CI

# Runs on OpenShip's self-hosted runner, never on GitHub-hosted runners (as in EdgeDesk).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Type-check, build
    # Pull requests from forks never run on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, openship, linux]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build lists merged PRs from git history (What's new)
      - uses: ./.github/actions/setup-bun
      - run: bun run type-check
      - run: bun run build
      - name: Bundle the Worker (no upload)
        run: bunx wrangler deploy --dry-run --outdir "${RUNNER_TEMP}/worker"
